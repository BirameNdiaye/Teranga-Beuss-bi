name: teranga-invit

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teranga}
      POSTGRES_USER: ${POSTGRES_USER:-teranga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      TZ: UTC
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-teranga}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teranga}
      MEDIA_DIR: /app/storage
      AUTH_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      TZ: Africa/Dakar
    volumes:
      - media-data:/app/storage
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  pg-data:
  media-data:
