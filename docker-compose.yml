name: teranga-invit

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teranga}
      MYSQL_USER: ${MYSQL_USER:-teranga}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Définissez MYSQL_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définissez MYSQL_ROOT_PASSWORD dans .env}
      TZ: Africa/Dakar
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  storage:
    # Stockage compatible S3 (SeaweedFS). Le bucket est créé par l'application au premier envoi.
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0 -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-teranga}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Définissez S3_SECRET_KEY dans .env}
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q HTTP']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-teranga}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-teranga}
      S3_ENDPOINT: http://storage:8333
      AUTH_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      TZ: Africa/Dakar
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  db-data:
  storage-data:
