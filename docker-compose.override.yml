# Chargé automatiquement par `docker compose up` : mode développement avec
# rechargement à chaud et Adminer. Pour la production :
#   docker compose -f docker-compose.yml up --build
services:
  web:
    build:
      target: dev
    command: ['sh', '-c', 'npx prisma generate && npx prisma migrate deploy && npm run dev']
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
      - media-data:/app/storage
      - web-next:/app/.next

  adminer:
    image: adminer:5.4.1
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '${ADMINER_PORT:-8080}:8080'

volumes:
  web-node-modules:
  web-next:
